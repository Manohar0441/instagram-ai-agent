[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -q --strict-markers
markers =
    unit: pure-logic tests with no I/O
    integration: service + repository tests against a real (SQLite) database
    api: full-stack tests through the HTTP layer
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
