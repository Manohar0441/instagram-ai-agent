version: "3.9"

services:
  postgres:
    image: postgres:16

    container_name: instagram-postgres

    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: instagram_ai

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7

    container_name: instagram-redis

    ports:
      - "6379:6379"

volumes:
  postgres_data: