name: Frontend CI/CD

# Every push (any branch) and every PR installs, typechecks/lints, and
# builds the frontend - fast feedback before anything is merged. Deploying
# to S3/CloudFront only happens after that same run passes, and only for a
# push to master (not a PR, and not any other branch) - see the `if:` guards
# below. There's no frontend test suite yet (no vitest/jest) - `tsc -b`
# (via `npm run build`) and oxlint are what "tested" means here today.
on:
  push:
    branches: ["**"]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"
  pull_request:
    paths:
      - "frontend/**"
  workflow_dispatch: {}

permissions:
  id-token: write # required for OIDC -> AWS role assumption
  contents: read

env:
  AWS_REGION: ap-south-1
  S3_BUCKET: instalysis-frontend-951151047337
  CLOUDFRONT_DISTRIBUTION_ID: E1FLOQVB4EASVO
  # The CloudFront domain fronts both the static app and /api/* -> the API
  # never needs a separate origin/CORS setup on the client side.
  VITE_API_BASE_URL: https://d24gbkw5emat7s.cloudfront.net
  # True only for a direct push to master - a PR from master, or a push to any
  # other branch, builds and checks but never touches AWS.
  IS_DEPLOY: ${{ github.ref == 'refs/heads/master' && github.event_name == 'push' }}

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build

      - name: Configure AWS credentials
        if: env.IS_DEPLOY == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::951151047337:role/instalysis-github-actions
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync build to S3
        if: env.IS_DEPLOY == 'true'
        run: aws s3 sync dist/ "s3://$S3_BUCKET/" --delete

      - name: Invalidate CloudFront cache
        if: env.IS_DEPLOY == 'true'
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/*"
